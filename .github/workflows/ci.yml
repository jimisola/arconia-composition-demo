name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Single non-matrix job: its name is the required status check on main.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # Mirrors run-with-gradle.sh, minus starting the application.
      - name: Gradle convention plugins
        run: |
          (cd redis-spring-boot-gradle-convention && ./gradlew clean publishToMavenLocal)
          (cd observability-spring-boot-gradle-convention && ./gradlew clean publishToMavenLocal)
      - name: Gradle app tests
        working-directory: arconia-composition-demo-app
        run: ./gradlew test integrationTest

      # Maven is not built here: the app pom needs modelVersion 4.2.0, newer than any
      # released Maven, and the 4.1.0-SNAPSHOT its wrapper pins is gone from the
      # snapshot repository. Add it back once Maven publishes a release that reads it.
