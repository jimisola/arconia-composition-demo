name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Single non-matrix job: its name is the required status check on main.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # Mirrors run-with-gradle.sh, minus starting the application.
      - name: Gradle convention plugins
        run: |
          (cd redis-spring-boot-gradle-convention && ./gradlew clean publishToMavenLocal)
          (cd observability-spring-boot-gradle-convention && ./gradlew clean publishToMavenLocal)
      - name: Gradle app tests
        working-directory: arconia-composition-demo-app
        run: ./gradlew test integrationTest

      # Mirrors run-with-maven.sh, minus starting the application.
      - name: Maven mixins
        run: |
          (cd redis-spring-boot-maven-mixin && ./mvnw -B clean install)
          (cd observability-spring-boot-maven-mixin && ./mvnw -B clean install)
      - name: Maven app tests
        working-directory: arconia-composition-demo-app
        run: ./mvnw -B test
